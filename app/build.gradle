plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.korkutsoftware.hilalim'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId "com.korkutsoftware.hilalim"
        minSdk 24
        targetSdk 37
        versionCode 6
        versionName "1.1.1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        debug {
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-3940256099942544/6300978111\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-3940256099942544/1033173712\""
        }
        release {
            buildConfigField "String", "ADMOB_BANNER_ID", "\"ca-app-pub-7360108740614201/8942923467\""
            buildConfigField "String", "ADMOB_INTERSTITIAL_ID", "\"ca-app-pub-7360108740614201/2012272656\""
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'src/main/keepRules/rules.keep'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation libs.activity.ktx
    implementation libs.appcompat
    implementation libs.constraintlayout
    implementation libs.junit.junit
    implementation libs.junit.junit
    implementation libs.material

    implementation libs.media3.exoplayer
    implementation libs.media3.session
    implementation libs.work.runtime
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.play.services.location
    implementation libs.play.services.ads

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    testImplementation libs.junit
    androidTestImplementation libs.espresso.core
    androidTestImplementation libs.ext.junit
}